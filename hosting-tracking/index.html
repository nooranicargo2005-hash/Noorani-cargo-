<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOORANI CARGO — SWB Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../hosting-admin/core.css">
</head>
<body class="public-website" style="background:#030303; overflow-y:auto;">
    <div class="container" style="max-width:1200px; margin:0 auto; padding:20px;">
        <header class="header-bar" style="border-radius:12px; margin-bottom:40px;">
            <div class="header-brand" style="display:flex; align-items:center; gap:16px;">
                <div class="logo-icon"><i class="fa-solid fa-shipping-fast"></i></div>
                <div>
                    <h1 style="font-size:1.2rem; color:var(--n-gold); letter-spacing:1px;">NOORANI CARGO</h1>
                    <p style="font-size:0.65rem; text-transform:uppercase; color:var(--n-text-muted); font-weight:800; letter-spacing:2px;">Public Tracking Center</p>
                </div>
            </div>
        </header>

        <section class="tracking-header" style="text-align:center; padding:100px 0;">
            <h1 style="font-size:4rem; color:#fff; letter-spacing:-2px;">TRACK YOUR <span style="color:var(--n-gold);">SWB</span></h1>
            <p class="text-muted" style="font-size:1.2rem; margin-top:10px;">Instant access to Sea Waybill documentation and cargo details.</p>
        </section>

        <section class="search-container" style="max-width:700px; margin:0 auto;">
            <div class="n-card" style="padding:24px; background:#111;">
                <div style="display:flex; gap:12px;">
                    <input id="swbInput" type="text" placeholder="Enter SWB Serial Number..." class="n-input" style="font-size:1.2rem; padding:20px;">
                    <button id="trackButton" class="n-btn primary" style="padding:0 40px; font-weight:800;">SEARCH</button>
                </div>
                <p id="statusMsg" style="text-align:center; margin-top:20px; color:var(--n-gold); font-weight:700; text-transform:uppercase; font-size:0.8rem;"></p>
            </div>
        </section>

        <main id="resultArea" hidden style="margin-top:60px;">
            <div class="info-card n-card" style="max-width:900px; margin:0 auto; padding:60px; background:#0a0a0a; border:1px solid var(--n-border-active);">
                <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; border-bottom:1px solid var(--n-border); padding-bottom:20px;">
                    <h2 style="color:var(--n-gold);"><i class="fa-solid fa-file-contract"></i> DOCUMENT DETAILS</h2>
                    <span id="displaySerial" style="font-family:monospace; font-size:1.5rem; color:#fff;"></span>
                </header>
                <div id="swbContent" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:40px;">
                    <!-- Data will be injected here -->
                </div>
            </div>
        </main>

        <div id="notFoundArea" hidden style="text-align:center; margin-top:60px;">
            <div class="n-card" style="display:inline-block; padding:60px; border-color:var(--n-danger); background:rgba(192, 57, 43, 0.05);">
                <i class="fa-solid fa-triangle-exclamation" style="font-size:4rem; color:var(--n-danger); margin-bottom:20px;"></i>
                <h2 style="color:#fff;">SWB NOT IDENTIFIED</h2>
                <p class="text-muted" style="font-size:1.1rem;">The system could not locate any record matching that serial number.</p>
            </div>
        </div>

        <footer style="text-align:center; margin-top:120px; padding:60px; border-top:1px solid var(--n-border); color:var(--n-text-muted);">
            <strong style="color:var(--n-gold); letter-spacing:4px;">NOORANI CARGO SERVICES</strong>
            <p style="font-size:0.75rem; margin-top:10px; text-transform:uppercase; font-weight:700;">Worldwide Logistics Assurance</p>
        </footer>
    </div>

    <script type="module">
        import { getSwbBySerial } from './firebase.js';

        const $id = id => document.getElementById(id);

        async function performTrack() {
            const id = $id('swbInput').value.trim().toUpperCase();
            if (!id) return;

            $id('statusMsg').textContent = 'ESTABLISHING SECURE CONNECTION...';
            $id('resultArea').hidden = true;
            $id('notFoundArea').hidden = true;

            try {
                const res = await getSwbBySerial(id);
                $id('statusMsg').textContent = '';

                if (res && res.data) {
                    const d = res.data;
                    $id('displaySerial').textContent = d.swbSerial;

                    const fields = [
                        { l: 'Cust. Inv. No.', v: d.custInvNo, icon: 'fa-hashtag' },
                        { l: 'SWB Date', v: d.swbDate, icon: 'fa-calendar-days' },
                        { l: 'Customer', v: d.customer, icon: 'fa-user-tie' },
                        { l: 'Customer Inv. No.', v: d.customerInvNo, icon: 'fa-receipt' },
                        { l: 'Shipper Name', v: d.shipperName, icon: 'fa-truck-ramp-box' },
                        { l: 'Consignee Name', v: d.consigneeName, icon: 'fa-box-open' },
                        { l: 'Orig. Qty', v: d.origQty, icon: 'fa-cubes' },
                        { l: 'Orig. Wt.', v: d.origWt, icon: 'fa-weight-hanging' },
                        { l: 'Consignee City', v: d.consigneeCity, icon: 'fa-city' },
                        { l: 'Consignee Address', v: d.consigneeAddress, icon: 'fa-map-location-dot' }
                    ];

                    $id('swbContent').innerHTML = fields.map(f => `
                        <div style="display:grid; gap:12px; padding:20px; background:rgba(255,255,255,0.02); border-radius:12px; border:1px solid rgba(255,255,255,0.05);">
                            <div style="display:flex; align-items:center; gap:10px; color:var(--n-gold);">
                                <i class="fa-solid ${f.icon}" style="font-size:0.9rem;"></i>
                                <span style="font-size:0.7rem; text-transform:uppercase; font-weight:800; letter-spacing:1px;">${f.l}</span>
                            </div>
                            <strong style="font-size:1.15rem; color:#fff; display:block;">${f.v || '—'}</strong>
                        </div>
                    `).join('');

                    $id('resultArea').hidden = false;
                    $id('resultArea').scrollIntoView({ behavior: 'smooth' });
                } else {
                    $id('notFoundArea').hidden = false;
                }
            } catch (err) {
                $id('statusMsg').textContent = 'DATABASE OFFLINE: PLEASE CONTACT NOORANI SUPPORT';
            }
        }

        $id('trackButton').onclick = performTrack;
        $id('swbInput').onkeydown = e => { if (e.key === 'Enter') performTrack(); };
    </script>
</body>
</html>
